x-service-defaults: &service-defaults
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *service-defaults
    image: postgres:16.14-alpine3.23
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - POSTGRES_DB=${TEMPORAL_POSTGRES_DB:-temporal}
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - POSTGRES_PASSWORD_FILE=/run/secrets/temporal_postgres_password
    ports:
      - "127.0.0.1:${TEMPORAL_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    secrets:
      - source: temporal_postgres_password
        target: temporal_postgres_password
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  temporal-schema:
    <<: *service-defaults
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
    restart: "on-failure:5"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - DB_PORT=5432
      - DBNAME=${TEMPORAL_POSTGRES_DB:-temporal}
      - VISIBILITY_DBNAME=${TEMPORAL_POSTGRES_VISIBILITY_DB:-temporal_visibility}
    entrypoint:
      - /opt/medchat/temporal-schema-setup.sh
    volumes:
      - ./scripts/temporal-schema-setup.sh:/opt/medchat/temporal-schema-setup.sh:ro
    secrets:
      - source: temporal_postgres_password
        target: temporal_postgres_password
    networks:
      - database

  temporal:
    <<: *service-defaults
    image: temporalio/server:1.29.7
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - DBNAME=${TEMPORAL_POSTGRES_DB:-temporal}
      - VISIBILITY_DBNAME=${TEMPORAL_POSTGRES_VISIBILITY_DB:-temporal_visibility}
      - BIND_ON_IP=0.0.0.0
      - TEMPORAL_ADDRESS=temporal:7233
      - PROMETHEUS_ENDPOINT=0.0.0.0:8000
    entrypoint:
      - /opt/medchat/temporal-server-entrypoint.sh
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_HOST_PORT:-7233}:7233"
    volumes:
      - ./scripts/temporal-server-entrypoint.sh:/opt/medchat/temporal-server-entrypoint.sh:ro
    secrets:
      - source: temporal_postgres_password
        target: temporal_postgres_password
    networks:
      - database
      - temporal
      - temporal-metrics
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  temporal-namespace:
    <<: *service-defaults
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
    restart: "on-failure:5"
    stop_grace_period: 30s
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - DEFAULT_NAMESPACE_RETENTION=${TEMPORAL_NAMESPACE_RETENTION:-72h}
      - MAX_ATTEMPTS=30
      - SLEEP_SECONDS=5
    entrypoint:
      - /opt/medchat/temporal-namespace-setup.sh
    volumes:
      - ./scripts/temporal-namespace-setup.sh:/opt/medchat/temporal-namespace-setup.sh:ro
    networks:
      - temporal

  temporal-exporter-role-sync:
    <<: *service-defaults
    image: postgres:16.14-alpine3.23
    restart: "on-failure:5"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${TEMPORAL_POSTGRES_DB:-temporal}
      - VISIBILITY_DBNAME=${TEMPORAL_POSTGRES_VISIBILITY_DB:-temporal_visibility}
      - PGUSER=${TEMPORAL_POSTGRES_USER:-temporal}
    entrypoint:
      - /opt/medchat/010-exporter.sh
    volumes:
      - ./postgres-init/010-exporter.sh:/opt/medchat/010-exporter.sh:ro
    secrets:
      - source: temporal_postgres_password
        target: temporal_postgres_password
      - source: temporal_postgres_exporter_password
        target: temporal_postgres_exporter_password
    networks:
      - database

  postgres-exporter:
    <<: *service-defaults
    image: ghcr.io/prometheus-community/postgres-exporter:v0.20.1
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      temporal-exporter-role-sync:
        condition: service_completed_successfully
        restart: true
    environment:
      - DATA_SOURCE_URI=postgres:5432/${TEMPORAL_POSTGRES_DB:-temporal}?sslmode=disable
      - DATA_SOURCE_USER=temporal_exporter
      - DATA_SOURCE_PASS_FILE=/run/secrets/temporal_postgres_exporter_password
    secrets:
      - source: temporal_postgres_exporter_password
        target: temporal_postgres_exporter_password
    networks:
      - database
      - postgres-metrics
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 4 http://127.0.0.1:9187/metrics | grep -Eq '^pg_up 1(\\.0)?$$'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal-ui:
    <<: *service-defaults
    image: temporalio/ui:2.53.1
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8080"
    networks:
      - temporal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres-exporter:
        condition: service_healthy
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus:/etc/prometheus:ro
    networks:
      - temporal-metrics
      - postgres-metrics
      - prometheus-grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    <<: *service-defaults
    image: grafana/grafana:12.4.8-ubuntu
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - source: grafana_admin_password
        target: grafana_admin_password
    networks:
      - prometheus-grafana
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  temporal-postgres-data:
  prometheus-data:
  grafana-data:

networks:
  database:
    internal: true
  temporal:
  temporal-metrics:
  postgres-metrics:
  prometheus-grafana:

secrets:
  temporal_postgres_password:
    file: ${TEMPORAL_POSTGRES_PASSWORD_FILE:?required}
  temporal_postgres_exporter_password:
    file: ${TEMPORAL_POSTGRES_EXPORTER_PASSWORD_FILE:?required}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?required}
