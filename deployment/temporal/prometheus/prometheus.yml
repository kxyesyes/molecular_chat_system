global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: temporal-server
    static_configs:
      - targets:
          - temporal:8000

  - job_name: temporal-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: medchat-temporal-worker
    static_configs:
      - targets:
          - host.docker.internal:9465
