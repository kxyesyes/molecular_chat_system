[server]
host = "127.0.0.1"
port = 8080
api_key = "${OPEN_SANDBOX_API_KEY}"
max_sandbox_timeout_seconds = 300

[log]
level = "INFO"
file_enabled = false

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.21"

[secure_runtime]
type = "gvisor"
docker_runtime = "runsc"

[storage]
allowed_host_paths = ["/var/lib/opensandbox/approved-empty"]

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[docker]
network_mode = "medchat-opensandbox"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = [
  "AUDIT_WRITE",
  "MKNOD",
  "NET_ADMIN",
  "NET_RAW",
  "SYS_ADMIN",
  "SYS_MODULE",
  "SYS_PTRACE",
  "SYS_TIME",
  "SYS_TTY_CONFIG",
]
no_new_privileges = true
pids_limit = 128
apparmor_profile = ""
seccomp_profile = ""

[ingress]
mode = "direct"
