<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ADMET 预测 · MedChat</title>
  <link rel="stylesheet" href="/static/css/subpage_header.css?v=20261005">
  <link rel="stylesheet" href="/static/css/mobile_baseline.css?v=20261005">
  <link rel="stylesheet" href="/static/css/admet.css?v=20261005">
  <script defer src="/static/js/admet.js?v=20261005"></script>
</head>
<body class="admet-page">
  <a class="skip-link" href="#workspace">跳到评估工作区</a>
  <header class="header">
    <div class="logo-section">
      <a class="logo-item" href="/" aria-label="海南大学药学院">
        <img src="/static/images/logo.png" alt="海南大学药学院">
        <span>海南大学药学院</span>
      </a>
      <span class="logo-divider" aria-hidden="true"></span>
      <a class="logo-item" href="/" aria-label="MedChat 首页">
        <img src="/static/images/logo2.png" alt="MedChat">
        <span>MedChat</span>
      </a>
    </div>
    <div class="nav-section">
      <span class="current-tool">ADMET 预测</span>
      <a class="back-btn" href="/">返回主页</a>
    </div>
  </header>

  <main>
    <section class="page-intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">ADMET 预测</h1>
        <p class="intro-copy">输入一个分子结构，查看物化性质和 ADMET 端点。</p>
      </div>
    </section>

    <div class="workspace" id="workspace">
      <aside class="input-panel" aria-labelledby="input-title">
        <div class="panel-heading">
          <div>
            <h2 id="input-title">分子输入</h2>
            <p class="panel-caption">输入结构，开始 ADMET 评估</p>
          </div>
          <span id="input-mode-label" class="input-mode-label">SMILES</span>
        </div>
        <form id="admet-form">
          <div class="input-mode-tabs" role="tablist" aria-label="分子输入方式">
            <button type="button" id="smiles-mode" class="input-mode-tab is-active" role="tab" aria-selected="true" aria-controls="smiles-input-panel">SMILES</button>
            <button type="button" id="file-mode" class="input-mode-tab" role="tab" aria-selected="false" aria-controls="file-input-panel">上传文件</button>
          </div>
          <div id="smiles-input-panel" class="input-mode-panel">
            <label for="smiles-input"><span>SMILES</span><span class="required-label">必填</span></label>
            <div class="textarea-wrap">
              <textarea id="smiles-input" name="smiles" maxlength="8192" rows="6" required spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="在此粘贴分子结构…"></textarea>
              <span id="smiles-count" class="smiles-count" aria-live="polite">0/8192</span>
            </div>
            <div class="examples-heading"><span>示例分子</span><span>点击填入</span></div>
            <div class="example-chips" aria-label="示例分子">
              <button type="button" class="example-chip" id="load-example" data-smiles="CC(=O)Oc1ccccc1C(=O)O">阿司匹林</button>
              <button type="button" class="example-chip" id="load-example-caffeine" data-smiles="Cn1c(=O)c2c(ncn2C)n(C)c1=O">咖啡因</button>
              <button type="button" class="example-chip" id="load-example-ibuprofen" data-smiles="CC(C)Cc1ccc(cc1)[C@@H](C)C(=O)O">布洛芬</button>
            </div>
          </div>
          <div id="file-input-panel" class="input-mode-panel" hidden>
            <label for="structure-file"><span>结构文件</span><span class="required-label">单个结构</span></label>
            <label class="file-dropzone" for="structure-file">
              <span class="file-drop-icon" aria-hidden="true">↑</span>
              <strong id="file-name">选择结构文件</strong>
              <span id="file-help">支持 .smi、.smiles、.txt、.csv</span>
              <input id="structure-file" type="file" accept=".smi,.smiles,.txt,.csv,text/plain,text/csv">
            </label>
            <p id="file-status" class="file-status" role="status" aria-live="polite">文件中的第一个结构将用于本次评估。</p>
          </div>
          <div id="structure-preview" class="structure-preview" hidden>
            <div class="preview-heading"><span>结构预览</span><span>RDKit</span></div>
            <img id="structure-preview-image" alt="输入分子的二维结构预览">
            <p id="structure-preview-message" class="preview-message">输入有效 SMILES 后显示结构。</p>
          </div>
          <div class="form-actions">
            <button type="submit" id="run-admet" class="primary-button"><span>运行 ADMET 评估</span><span aria-hidden="true">→</span></button>
            <button type="button" id="reset-admet" class="reset-button">清空输入与结果</button>
          </div>
        </form>
        <noscript><p class="error-note">请启用 JavaScript 后提交评估；本页不会显示预设预测结果。</p></noscript>
      </aside>

      <section class="results-panel" aria-labelledby="results-title" aria-busy="false" data-state="not_calculated" id="results-panel">
        <div class="results-header">
          <div>
            <h2 id="results-title">预测结果</h2>
            <p id="completed-at" class="completed-at">尚未运行</p>
          </div>
          <div class="results-actions">
            <span id="status-badge" class="status-badge state-not-calculated">尚未运行</span>
            <button type="button" id="rerun-admet" class="rerun-button">重新预测</button>
          </div>
        </div>
        <p id="run-status" class="run-status" role="status" aria-live="polite" aria-atomic="true">等待输入分子结构。提交后将在此显示实际工具结果。</p>
        <div id="admet-overview" class="admet-overview"></div>
        <div id="metric-cards" class="metric-cards" aria-label="评估摘要"></div>
        <nav id="endpoint-tabs" class="endpoint-tabs" aria-label="ADMET 端点分类"></nav>
        <div id="empty-state" class="empty-state">
          <div class="empty-monogram" aria-hidden="true">A<span>D</span>M<span>E</span>T<span class="monogram-dot">.</span></div>
          <h3>等待输入分子结构</h3>
          <p>提交后显示实际工具结果。</p>
          <div class="empty-workflow" aria-label="ADMET 评估流程">
            <div class="workflow-step"><span>01</span><strong>输入结构</strong><em>粘贴 SMILES</em></div>
            <div class="workflow-step"><span>02</span><strong>执行计算</strong><em>调用真实工具</em></div>
            <div class="workflow-step"><span>03</span><strong>核对结果</strong><em>查看端点与来源</em></div>
          </div>
        </div>
        <div id="endpoint-groups" class="endpoint-groups"></div>
        <div id="evidence-panel" class="evidence-panel" hidden aria-hidden="true"></div>
      </section>
    </div>
  </main>
</body>
</html>
